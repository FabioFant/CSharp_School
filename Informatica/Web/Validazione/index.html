<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <title>Validazione Input</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body>
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid justify-content-center">
              <span class="navbar-brand mb-0 h1">Validazione Input</span>
            </div>
        </nav>

        <div class="container-sm d-flex flex-column justify-content-center vh-100 text-center">
            <form>
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text">Nome e Cognome</span>
                        <input id="nome" type="text" class="form-control">
                        <input id="cognome" type="text" class="form-control">
                    </div>
                    <div class="form-text text-warning" id="errorNome" hidden></div>
                </div>
        
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text">Data di nascita</span>
                        <input id="dataDiNascita" type="date" class="form-control">
                    </div>
                    <div class="form-text text-warning" id="errorData" hidden></div>
                </div>
                  
                <div class="mb-3">
                    <div class="input-group">
                      <span class="input-group-text" id="basic-addon3">E-mail</span>
                      <input id="email" type="email" class="form-control" id="basic-url" aria-describedby="basic-addon3 basic-addon4">
                    </div>
                    <div class="form-text" id="basic-addon4">Formato: nome@mail.com</div>
                    <div class="form-text text-warning" id="errorEmail" hidden></div>
                </div>
                  
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text">Nome utente</span>
                        <input id="utente" type="text" class="form-control">
                    </div>
                    <div class="form-text text-warning" id="errorUser" hidden></div>
                </div>
        
                <div class="mb-3">
                    <div class="input-group">
                      <span class="input-group-text" id="basic-addon3">Password</span>
                      <input id="password" type="password" class="form-control" id="basic-url" aria-describedby="basic-addon3 basic-addon4">
                    </div>
                    <div class="form-text" id="basic-addon4">Deve contenere almeno 8 caratteri, una lettera maiuscola e minuscola, un carattere speciale</div>
                    <div class="form-text text-warning" id="errorPassword" hidden></div>
                </div>
        
                <input id="submit" class="btn btn-outline-primary" type="button" value="Submit">
            </form>
        </div>

        <footer class="bg-dark text-white text-center">
            <p>Fabio Fantini 4H 2025-03-14</p>
        </footer>  

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="./script.js"></script>
    </body>
</html>
