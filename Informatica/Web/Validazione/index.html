<!--Form con validazione dell'input-->

<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
    <!-- Definisce la lingua della pagina come italiano e imposta il tema scuro di Bootstrap -->
    <head>
        <meta charset="utf-8">
        <title>Validazione Input</title>
        <!-- Titolo della pagina visibile nella barra del browser -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Meta tag per la gestione della larghezza della pagina sui dispositivi mobili -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <!-- Include il CSS di Bootstrap per lo stile responsive e moderno -->
        <style>
            /* Stile per i messaggi di errore */
            .error-message { color: #dc3545; font-size: 0.875em; }
            /* Stile per gli input con errore */
            .form-control.is-invalid { border-color: #dc3545; }
        </style>
    </head>
    <body>
        <!-- Barra di navigazione -->
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid justify-content-center">
                <span class="navbar-brand mb-0 h1">Validazione Input</span>
            </div>
        </nav>

        <!-- Div per visualizzare messaggi di errore globali -->
        <div id="form-errors" class="alert alert-danger d-none mb-3"></div>

        <!-- Sezione principale del contenuto -->
        <div class="container-sm d-flex flex-column justify-content-center vh-100 text-center">
            <!-- Form di validazione -->
            <form id="form">
                <!-- Sezione per il campo 'Nome e Cognome' -->
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text">Nome e Cognome</span>
                        <!-- Input per il nome -->
                        <label for="name" class="form-label"></label>
                        <input id="name" name="name" type="text" class="form-control">
                        <!-- Input per il cognome -->
                        <label for="surname" class="form-label"></label>
                        <input id="surname" name="surname" type="text" class="form-control">
                    </div>
                    <div class="error-message"></div>
                    <!-- Messaggio di errore per i campi Nome e Cognome -->
                </div>
        
                <!-- Sezione per il campo 'Data di nascita' -->
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text">Data di nascita</span>
                        <label for="birthdate" class="form-label"></label>
                        <input id="birthdate" name="birthdate" type="date" class="form-control" min="1905-01-01" max="2011-12-31">
                    </div>
                    <div class="error-message"></div>
                    <!-- Messaggio di errore per la Data di nascita -->
                </div>
                  
                <!-- Sezione per il campo 'E-mail' -->
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text" id="basic-addon3">E-mail</span>
                        <label for="email" class="form-label"></label>
                        <input id="email" name="email" type="email" class="form-control" id="basic-url" aria-describedby="basic-addon3 basic-addon4">
                    </div>
                    <!-- Descrizione del formato e-mail -->
                    <div class="form-text" id="basic-addon4">Formato: nome@mail.com</div>
                    <div class="error-message"></div>
                    <!-- Messaggio di errore per il campo E-mail -->
                </div>
                  
                <!-- Sezione per il campo 'Nome utente' -->
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text">Nome utente</span>
                        <label for="username" class="form-label"></label>
                        <input id="username" name="username" type="text" class="form-control">
                    </div>
                    <div class="error-message"></div>
                    <!-- Messaggio di errore per il campo Nome utente -->
                </div>
        
                <!-- Sezione per il campo 'Password' -->
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text" id="basic-addon3">Password</span>
                        <label for="password" class="form-label"></label>
                        <input id="password" name="password" type="password" class="form-control" id="basic-url" aria-describedby="basic-addon3 basic-addon4">
                    </div>
                    <!-- Descrizione dei requisiti della password -->
                    <div class="form-text" id="basic-addon4">Deve contenere almeno 8 caratteri, una lettera maiuscola e minuscola, un carattere speciale</div>
                    <div class="error-message"></div>
                    <!-- Messaggio di errore per il campo Password -->
                </div>
        
                <!-- Bottone di invio del modulo -->
                <input id="submit" class="btn btn-outline-primary" type="Submit" value="Submit">
            </form>
        </div>

        <!-- Footer della pagina con informazioni sul creatore -->
        <footer class="bg-dark text-white text-center">
            <p>Fabio Fantini 4H 2025-04-04</p>
        </footer>  

        <!-- Inclusione di script JavaScript per Bootstrap e JQuery -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
        <!-- Link al file JavaScript personalizzato (presumibilmente per la validazione del modulo) -->
        <script src="./script.js"></script>
    </body>
</html>
