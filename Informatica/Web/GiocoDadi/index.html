<!-- HTML del sito -->

<!DOCTYPE html>
<html lang="it" data-bs-theme="dark"> <!-- Impostazione della lingua italiana e tema scuro per Bootstrap -->
    <head>
        <meta charset="UTF-8"> <!-- Impostazione della codifica caratteri a UTF-8 -->
        <title>Gioco dei dadi</title> <!-- Titolo della pagina -->
        <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Impostazioni per la visualizzazione su dispositivi mobili -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> <!-- Inclusione di Bootstrap per la gestione della grafica -->
    </head>
    <body>
        <!-- Barra di navigazione -->
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid justify-content-center">
              <span class="navbar-brand mb-0 h1">Gioco dei Dadi</span> <!-- Titolo della pagina nel navbar -->
            </div>
        </nav>
        
        <!-- Contenuto principale della pagina -->
        <div class="container-sm d-flex flex-column justify-content-center vh-100 text-center">
            <!-- Visualizzazione del saldo attuale -->
            <h3 id="saldo">Saldo: </h3>
            
            <!-- Sezione per inserire i dati della scommessa -->
            <div class="row my-3">
                <!-- Input per il numero puntato -->
                <div class="col-sm">
                  <input id="numero_puntato" type="number" class="form-control" placeholder="Numero" aria-label="Numero" min="2" max="12">
                </div>
                <!-- Input per il saldo puntato -->
                <div class="col-sm">
                  <input id="saldo_puntato" type="number" class="form-control" placeholder="Saldo" aria-label="Saldo" min="1">
                </div>
            </div>
            
            <!-- Bottone per iniziare il gioco -->
            <div class="row my-3">
                <input id="inizia" class="btn btn-outline-primary" type="button" value="Inizia">
            </div>
            
            <!-- Risultato del gioco e pulsante per rincominciare -->
            <div>
                <h1 class="text-warning" id="numero_uscito"></h1> <!-- Visualizzazione del numero uscito -->
                <h5 id="esito"></h5> <!-- Esito del gioco (vittoria o sconfitta) -->
                <input id="rincomincia" class="btn btn-outline-secondary" type="button" value="Rincomincia" hidden> <!-- Bottone per rincominciare, inizialmente nascosto -->
            </div> 
        </div>
        
        <!-- Footer della pagina -->
        <footer class="bg-dark text-white text-center">
            <p>Fabio Fantini 4H 2025-03-14</p> <!-- Testo del footer con il nome e la data -->
        </footer>   
      
        <!-- Inclusione del bundle di Bootstrap per il funzionamento di componenti interattivi (es. bottoni, modali) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

        <!-- Script per il funzionamento del gioco -->
        <script src="./code.js"></script> <!-- Inclusione del file JavaScript personalizzato -->
    </body>
</html>
